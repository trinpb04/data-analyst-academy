<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="shadcn base 8px — chips to pills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .row { display: flex; gap: 20px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 64px; height: 64px; background: var(--teal-50); border: 1.5px solid var(--teal-400); }
  .lbl { font: var(--type-meta); color: var(--text-strong); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm</span><span class="px">4px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md</span><span class="px">6px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg</span><span class="px">8px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lbl">xl</span><span class="px">12px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="lbl">2xl</span><span class="px">16px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-full)"></div><span class="lbl">full</span><span class="px">pill</span></div>
  </div>
</body>
</html>
