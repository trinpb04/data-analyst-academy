<!-- @dsCard group="Colors" viewport="700x150" name="Slate Ink" subtitle="Neutral foundation — text, surfaces, borders" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 0; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .sw span { font: var(--type-meta); font-size: 11px; }
  .sw .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
  .lo { color: var(--slate-900); }
  .hi { color: #fff; }
  .cap { margin-top: 12px; font: var(--type-meta); color: var(--text-muted); }
  .cap b { color: var(--text-strong); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw lo" style="background:var(--slate-50);box-shadow:inset 0 0 0 1px var(--border)"><span>50</span><span class="hex">#F8FAFC</span></div>
    <div class="sw lo" style="background:var(--slate-100)"><span>100</span><span class="hex">#F1F5F9</span></div>
    <div class="sw lo" style="background:var(--slate-200)"><span>200</span><span class="hex">#E2E8F0</span></div>
    <div class="sw lo" style="background:var(--slate-300)"><span>300</span><span class="hex">#CBD5E1</span></div>
    <div class="sw lo" style="background:var(--slate-400)"><span>400</span><span class="hex">#94A3B8</span></div>
    <div class="sw hi" style="background:var(--slate-500)"><span>500</span><span class="hex">#64748B</span></div>
    <div class="sw hi" style="background:var(--slate-600)"><span>600</span><span class="hex">#475569</span></div>
    <div class="sw hi" style="background:var(--slate-700)"><span>700</span><span class="hex">#334155</span></div>
    <div class="sw hi" style="background:var(--slate-800)"><span>800</span><span class="hex">#1E293B</span></div>
    <div class="sw hi" style="background:var(--slate-950)"><span>950</span><span class="hex">#020817</span></div>
  </div>
  <div class="cap"><b>950</b> ink &amp; primary action · <b>700</b> body · <b>500</b> muted · <b>200</b> borders · <b>50</b> page</div>
</body>
</html>
