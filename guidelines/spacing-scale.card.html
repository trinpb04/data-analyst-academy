<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px grid — the rhythm of every gap & pad" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--teal-500); border-radius: var(--radius-sm); width: 100%; }
  .b { width: 28px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar b" style="height:4px"></div><span class="lbl">1</span><span class="px">4</span></div>
    <div class="item"><div class="bar b" style="height:8px"></div><span class="lbl">2</span><span class="px">8</span></div>
    <div class="item"><div class="bar b" style="height:12px"></div><span class="lbl">3</span><span class="px">12</span></div>
    <div class="item"><div class="bar b" style="height:16px"></div><span class="lbl">4</span><span class="px">16</span></div>
    <div class="item"><div class="bar b" style="height:24px"></div><span class="lbl">6</span><span class="px">24</span></div>
    <div class="item"><div class="bar b" style="height:32px"></div><span class="lbl">8</span><span class="px">32</span></div>
    <div class="item"><div class="bar b" style="height:48px"></div><span class="lbl">12</span><span class="px">48</span></div>
    <div class="item"><div class="bar b" style="height:64px"></div><span class="lbl">16</span><span class="px">64</span></div>
    <div class="item"><div class="bar b" style="height:80px"></div><span class="lbl">20</span><span class="px">80</span></div>
  </div>
</body>
</html>
