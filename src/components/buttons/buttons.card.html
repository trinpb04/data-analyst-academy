<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .grp { display: flex; flex-direction: column; gap: 16px; }
  .rowlabel { font: var(--type-meta); color: var(--text-faint); text-transform: uppercase; letter-spacing: var(--tracking-wide); width: 64px; flex-shrink: 0; }
  .line { display: flex; align-items: center; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton } = window.DataAnalystAcademyDesignSystem_f0f875;
  const Stroke = (p) => ({ fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', ...p });
  const Arrow = () => <svg viewBox="0 0 24 24" {...Stroke()}><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
  const Play = () => <svg viewBox="0 0 24 24" {...Stroke({fill:'currentColor',stroke:'none'})}><path d="M6 4l14 8-14 8z"/></svg>;
  const Close = () => <svg viewBox="0 0 24 24" {...Stroke()}><path d="M18 6 6 18M6 6l12 12"/></svg>;
  const Refresh = () => <svg viewBox="0 0 24 24" {...Stroke()}><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>;

  function Demo() {
    return (
      <div className="grp">
        <div className="line">
          <span className="rowlabel">Variant</span>
          <Button icon={<Play/>}>Start path</Button>
          <Button variant="ink" iconRight={<Arrow/>}>Open lesson</Button>
          <Button variant="secondary">Browse</Button>
          <Button variant="outline">Filter</Button>
          <Button variant="ghost">← Back</Button>
          <Button variant="danger">Reset</Button>
        </div>
        <div className="line">
          <span className="rowlabel">Size</span>
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
          <Button disabled>Disabled</Button>
        </div>
        <div className="line">
          <span className="rowlabel">Icon</span>
          <IconButton variant="outline" aria-label="Refresh"><Refresh/></IconButton>
          <IconButton variant="ghost" aria-label="Close"><Close/></IconButton>
          <IconButton variant="ink" aria-label="Play"><Play/></IconButton>
          <IconButton variant="brand" aria-label="Next"><Arrow/></IconButton>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
